name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# colcon test runs ament_flake8, ament_pep257, ament_lint_cmake and
# ament_xmllint, each configured for its own distro. That is the only
# lint config this repo keeps - a second hand-rolled one drifts from it.
jobs:
  colcon:
    name: colcon (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/isaac_sim_mobile_robot_rtab_map

      - name: Install build and lint dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-${{ matrix.ros_distro }}-ament-lint-auto \
            ros-${{ matrix.ros_distro }}-ament-lint-common
          rm -rf /var/lib/apt/lists/*

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --symlink-install

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
